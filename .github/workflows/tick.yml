name: Bot sweep
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-bot-sweep
  cancel-in-progress: false
jobs:
  tick:
    # Explicit rollout gate. Enable only after cloud migration, source verification,
    # fixture/outbox review and approval for production notifications.
    if: vars.TGCLOUD_SWEEP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked management CLI
        working-directory: bot
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Invoke deployed sweep through authenticated management API
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          SCHEDULER_ADMIN_ID: ${{ vars.SCHEDULER_ADMIN_ID }}
        run: node bot/scripts/scheduled-tick.mjs
